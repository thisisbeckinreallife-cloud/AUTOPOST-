[build]
# Builder: Dockerfile multi-stage (antes Nixpacks). La imagen base fija la
# version exacta de Node (node:22.23.4-slim, parche CVE-2026-111497 del
# 21 oct 2026); Nixpacks ancla nodejs_22 a 22.14.0 y no la respetaria.
# Probar en local con: docker build -t autopost:test .
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
preDeployCommand = ["npm run db:migrate"]
startCommand = "npm start"

# Healthcheck — Railway llama esta ruta tras el deploy. Si responde 200,
# considera el deploy "healthy" y enruta tráfico hacia él. Si responde
# 503 o timeout, tira el container y reintenta. Cubre casos donde el
# build pasa pero la app crashea al arrancar (DB caída, secrets faltantes).
healthcheckPath = "/api/healthz"
healthcheckTimeout = 300

# Si el container falla varias veces, restart automático.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
